name: Full-Stack CI Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - 'feature/**'
      - 'fix/**'
      - develop
      - development
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-check:
    name: Security & File Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Ensure Scripts are Executable
        run: chmod +x scripts/check-sensitive-files.sh || true
        
      - name: Check for sensitive files
        run: ./scripts/check-sensitive-files.sh

  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    needs: security-check
    defaults:
      run:
        working-directory: ./ecommerce-frontend
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './ecommerce-frontend/package-lock.json'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run lint
        run: |
          if npm run | grep -q "lint"; then
            npm run lint
          else
            echo "No frontend lint script configured."
          fi
          
      - name: Run unit tests
        run: |
          if npm run | grep -q "test"; then
            npm test -- --run
          else
            echo "No valid frontend test script configured."
          fi
          
      - name: Run coverage
        run: |
          if npm run | grep -q "test:coverage"; then
            npm run test:coverage
          else
            echo "No coverage script configured."
          fi
          
      - name: Upload coverage artifact
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: ./ecommerce-frontend/coverage/
          retention-days: 7
          if-no-files-found: ignore
          
      - name: Build application
        run: npm run build
        
      - name: Validate build output
        run: |
          if [ ! -d "dist" ]; then
            echo "Build command succeeded, but 'dist' directory is missing!"
            exit 1
          fi
          
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: ./ecommerce-frontend/dist/
          retention-days: 7

  backend-ci:
    name: Backend CI - ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: security-check
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - cart-service
          - inventory-service
          - notification-service
          - notification-worker
          - order-service
          - payment-service
          - product-service
          
    defaults:
      run:
        working-directory: ./ecommerce-backend/${{ matrix.service }}
        
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './ecommerce-backend/${{ matrix.service }}/package-lock.json'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run lint
        run: |
          if npm run | grep -q "^  lint"; then
            npm run lint
          else
            echo "No lint script configured for this service."
          fi
          
      - name: Run unit tests
        run: |
          if npm run | grep -q "^  test"; then
            TEST_SCRIPT=$(npm run env | grep "^npm_package_scripts_test=" || true)
            if echo "$TEST_SCRIPT" | grep -q "Error: no test specified"; then
               echo "No valid test script configured for this service."
            else
               npm test -- --runInBand
            fi
          else
            echo "No valid test script configured for this service."
          fi
          
      - name: Validate Lambda Handler
        run: ../../scripts/validate-lambda-handler.sh ${{ matrix.service }}
        working-directory: ./
        
  ci-summary:
    name: CI Pipeline Summary
    runs-on: ubuntu-latest
    needs: [security-check, frontend-ci, backend-ci]
    if: always()
    steps:
      - name: Check pipeline success
        run: |
          echo "Frontend CI: ${{ needs.frontend-ci.result }}"
          echo "Backend CI: ${{ needs.backend-ci.result }}"
          echo "Security Check: ${{ needs.security-check.result }}"
          
          if [ "${{ needs.frontend-ci.result }}" != "success" ]; then
            echo "Pipeline failed because frontend-ci failed."
            exit 1
          fi
          
          if [ "${{ needs.backend-ci.result }}" != "success" ]; then
            echo "Pipeline failed because backend-ci failed."
            exit 1
          fi
          
          if [ "${{ needs.security-check.result }}" != "success" ]; then
            echo "Pipeline failed because security-check failed."
            exit 1
          fi
          
          echo "All checks passed successfully!"
